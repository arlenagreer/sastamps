name: CI Testing Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# One run per branch at a time. On main, runs queue rather than cancel: the
# deploy job publishes the artifact its own test job built, so without this a
# slow run for an older push could deploy after, and over, a newer one.
# Elsewhere a newer push cancels the superseded run, saving Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Create reports directory
      run: mkdir -p reports
      
    - name: Run HTML validation
      run: npm run test:html
      continue-on-error: true
      
    - name: Run CSS validation
      run: npm run test:css
      continue-on-error: true
      
    - name: Run JavaScript linting
      run: npm run test:js
      continue-on-error: true
      
    - name: Run Markdown linting
      run: npm run test:md
      continue-on-error: true
      
    # One build: _site/ is both what the checks below test and, on a push to
    # main, exactly what the deploy job publishes. test:site-build runs
    # npm run build and fails if it rewrote a tracked file or assembled a
    # _site/ with a missing page, a broken local reference, or a file that
    # must never be served (*.php, *.db, scripts/, dotfiles).
    - name: Build the site and check it
      run: npm run test:site-build

    - name: Check inline scripts in the built pages
      run: npm run test:inline-js:site
      
    - name: Start server for link checking
      run: |
        npm run serve &
        sleep 5
        
    - name: Run link checker
      run: |
        npx broken-link-checker http://localhost:3000 --recursive --exclude-external --filter-level 3 || true
        
    - name: Run accessibility tests
      run: npm run test:a11y
      continue-on-error: true
      
    - name: Run Lighthouse audit
      uses: treosh/lighthouse-ci-action@v12
      with:
        urls: |
          http://localhost:3000
          http://localhost:3000/about.html
          http://localhost:3000/meetings.html
          http://localhost:3000/contact.html
        uploadArtifacts: true
        temporaryPublicStorage: true
        
    - name: Upload test reports
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: test-reports
        path: reports/
        retention-days: 30
        
    - name: Security audit
      run: npm audit --audit-level=moderate
      continue-on-error: true

    - name: Upload the built site for deployment
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v5
      with:
        path: '_site'

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Serialize GitHub Pages deployments so rapid successive pushes to main
    # don't collide ("deployment request failed ... due to in progress
    # deployment"). Queue (don't cancel) so an in-flight deploy finishes.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    # No checkout and no second build: this publishes the _site/ artifact the
    # test job built and checked, so what deploys is what was tested.
    steps:
    - name: Setup Pages
      uses: actions/configure-pages@v6

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
